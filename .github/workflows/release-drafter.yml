name: Release drafter

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: Update draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false
          fetch-depth: 0

      # Without a published release the drafter has nothing to compare with and lists no changes, so the first draft
      # starts at the first commit.
      - name: Find the baseline of a first release
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft | not)] | length')"
          if [[ "$published" == 0 ]]; then
            echo "from=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          commitish: dev
          from: ${{ steps.baseline.outputs.from }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Group changes and add the release notes
        uses: whereareiam/blockops/primitive/release/draft/regroup@v4
        with:
          release-id: ${{ steps.drafter.outputs.id }}
          release-body: ${{ steps.drafter.outputs.body }}
          notes-file: .github/release-notes.md
          version: ${{ steps.drafter.outputs.resolved_version }}
