version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/setup"
      - "/report"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Dependency"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "gradle"
    directory: "/.github/check"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Dependency"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
