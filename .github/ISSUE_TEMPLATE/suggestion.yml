name: Suggestion
description: Suggest a new action or a change to an existing one.
labels:
  - suggestion
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What your workflow needs and what stops it today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other solutions you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup
        - Report
        - A new action or workflow
